<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <title>HORIZON — Explore</title>
  <link rel="stylesheet" href="/style.css">

  <style>
    .detail {
      min-height: 100vh;
      padding: 150px 10vw 90px;
      max-width: 1500px;
      margin: auto;
    }

    .detail-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 55px;
    }

    .back {
      font-size: 13px;
      color: #c2ccda;
      border-bottom: 1px solid #52627a;
      padding-bottom: 8px;
    }

    .detail h1 {
      font: 800 clamp(48px, 8vw, 100px)/1.05 Manrope, sans-serif;
      letter-spacing: -5px;
      margin: 25px 0;
      overflow-wrap: anywhere;
    }

    .detail-short {
      max-width: 760px;
      color: #d0d9e7;
      font-size: clamp(17px, 2vw, 22px);
      line-height: 1.7;
      white-space: pre-line;
    }

    .detail-image {
      display: block;
      width: 100%;
      max-height: 600px;
      object-fit: cover;
      border-radius: 22px;
      margin: 45px 0;
      background: #101722;
    }

    .detail-copy {
      max-width: 850px;
      color: #b9c5d6;
      line-height: 2;
      font-size: 15px;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .detail-actions {
      margin-top: 35px;
    }

    .detail-status {
      display: inline-block;
      color: #9bbcff;
      font-size: 10px;
      letter-spacing: 2px;
      font-weight: 700;
      margin-top: 20px;
    }

    .detail-error {
      color: #ffb4b4;
      line-height: 1.8;
      padding: 25px;
      border: 1px solid #773d48;
      border-radius: 12px;
      background: #32151d;
    }

    @media (max-width: 700px) {
      .detail {
        padding: 125px 7vw 70px;
      }

      .detail-top {
        margin-bottom: 40px;
      }

      .detail h1 {
        letter-spacing: -3px;
      }

      .detail-image {
        border-radius: 14px;
        margin: 30px 0;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <a class="wordmark" href="/">HORIZON<span>.</span></a>
    <a href="/" class="back">Back to HORIZON ↗</a>
  </header>

  <main class="detail">

    <div class="detail-top">
      <p class="eyebrow" id="type">HORIZON / EXPLORE</p>
    </div>

    <div id="content">
      <p class="eyebrow">PLEASE WAIT</p>
      <h1>Loading...</h1>
      <p class="detail-copy">Preparing your experience.</p>
    </div>

  </main>

  <script>
    (async function () {
      const content = document.getElementById("content");
      const typeElement = document.getElementById("type");

      const params = new URLSearchParams(location.search);
      const id = params.get("id");

      if (!id) {
        showError("No product or service was selected.");
        return;
      }

      try {
        const response = await fetch(
          "/api/items/" + encodeURIComponent(id)
        );

        if (!response.ok) {
          showError(
            response.status === 404
              ? "This product or service could not be found."
              : "Unable to load this page right now."
          );
          return;
        }

        const item = await response.json();

        if (!item || !item.name) {
          showError("The requested content is unavailable.");
          return;
        }

        document.title = "HORIZON — " + item.name;

        typeElement.textContent =
          "HORIZON / " + String(item.type || "EXPLORE").toUpperCase();

        content.innerHTML = `
          <span class="detail-status" id="itemStatus"></span>

          <h1 id="itemName"></h1>

          <p class="detail-short" id="itemShort"></p>

          <img
            id="itemImage"
            class="detail-image"
            hidden
            alt=""
          >

          <p class="detail-copy" id="itemDescription"></p>

          <div class="detail-actions">
            <a
              id="itemButton"
              class="pill"
              hidden
              target="_blank"
              rel="noopener noreferrer"
            ></a>
          </div>
        `;

        document.getElementById("itemStatus").textContent =
          String(item.status || "").replaceAll("_", " ").toUpperCase();

        document.getElementById("itemName").textContent =
          item.name || "";

        document.getElementById("itemShort").textContent =
          item.short_perception || "";

        document.getElementById("itemDescription").textContent =
          item.description || "";

        if (item.image) {
          const image = document.getElementById("itemImage");

          image.src = item.image;
          image.alt = item.name || "HORIZON image";
          image.hidden = false;
        }

        if (item.status === "published" && item.button_url) {
          const button = document.getElementById("itemButton");

          button.href = item.button_url;
          button.textContent =
            (item.button_text || "Explore") + " ↗";

          button.hidden = false;
        }

      } catch (error) {
        showError("Something went wrong while loading this page.");
      }

      function showError(message) {
        content.innerHTML = `
          <div class="detail-error">
            <p class="eyebrow">HORIZON / NOTICE</p>
            <h1>Unavailable</h1>
            <p></p>
            <a href="/" class="pill">Return to HORIZON ↗</a>
          </div>
        `;

        content.querySelector(".detail-error p:not(.eyebrow)")
          .textContent = message;

        document.title = "HORIZON — Unavailable";
      }
    })();
  </script>

</body>
  </html>
