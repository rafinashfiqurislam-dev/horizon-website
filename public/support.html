<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HORIZON Support</title><link rel="stylesheet" href="/style.css"><style>.support-page{max-width:850px;margin:130px auto;padding:30px}.support-page h1{font:800 60px Manrope}.support-box{background:#111c2b;padding:28px;border-radius:18px;margin:20px 0}.support-box input,.support-box textarea,.support-box select{width:100%;padding:14px;background:#080e18;color:white;border:1px solid #39465a;border-radius:9px;margin:8px 0 15px}.support-box button{margin-top:10px}.faq-row{padding:14px 0;border-bottom:1px solid #344052;cursor:pointer}.faq-row p{color:#b8c4d5}.back{color:#9dbbff}</style></head><body><header class="topbar"><a class="wordmark" href="/">HORIZON<span>.</span></a><a class="back" href="/">Back to home ↗</a></header><main class="support-page"><p class="eyebrow">HORIZON / SUPPORT</p><h1>How can we<br><em>help you?</em></h1><div class="support-box"><h2>Search for help</h2><input id="search" placeholder="Search a product or question..."><div id="faqs"></div></div><div class="support-box"><h2>Contact support</h2><form id="contact"><label>Email</label><input type="email" name="email" required placeholder="you@example.com"><label>Your message</label><textarea name="message" rows="5" required placeholder="How can we help?"></textarea><button class="pill">Send message ↗</button><p id="contactStatus"></p></form></div><div class="support-box"><h2>Send feedback</h2><form id="feedback"><input name="email" type="email" placeholder="Email (optional)"><textarea name="message" rows="4" required placeholder="Share your feedback..."></textarea><button class="pill">Send feedback ↗</button><p id="feedbackStatus"></p></form></div></main><script>
let questions=[];fetch('/api/help').then(r=>r.json()).then(d=>{questions=d;draw('')});
function draw(q){const box=document.querySelector('#faqs');box.innerHTML='';questions.filter(x=>(x.question_en+' '+x.question_bn+' '+x.item_name).toLowerCase().includes(q.toLowerCase())).forEach(x=>{const d=document.createElement('div');d.className='faq-row';const b=document.createElement('b');b.textContent=x.item_name+' — '+x.question_en;const p=document.createElement('p');p.textContent=x.question_bn;const answer=document.createElement('p');answer.hidden=true;answer.textContent=x.answer||'Answer will be available soon.';d.append(b,p,answer);d.addEventListener('click',()=>answer.hidden=!answer.hidden);box.append(d)})}
document.querySelector('#search').addEventListener('input',e=>draw(e.target.value));
async function submitForm(id,url,status){document.querySelector(id).addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();document.querySelector(status).textContent=r.ok?'Thank you. Your message has been received.':(d.error||'Could not submit.');if(r.ok)e.target.reset()})}
submitForm('#contact','/api/messages','#contactStatus');submitForm('#feedback','/api/feedback','#feedbackStatus');
</script></body></html>
