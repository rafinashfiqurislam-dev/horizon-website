
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HORIZON — Create Admin</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080d18;color:#eef3ff;font:16px system-ui;padding:20px}
    main{width:min(100%,420px);padding:28px;border:1px solid #26344c;border-radius:18px;background:#101a2b}
    h1{margin:0 0 8px;font-size:25px}
    p{color:#aebbd0;line-height:1.5}
    label{display:block;margin:18px 0 7px;font-size:14px}
    input{width:100%;padding:13px;border-radius:9px;border:1px solid #34445f;background:#091222;color:white;font:inherit}
    button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:9px;background:#77a9ff;color:#07101e;font-weight:700;font-size:16px}
    button:disabled{opacity:.6}
    #message{margin-top:16px;overflow-wrap:anywhere}
  </style>
</head>
<body>
<main>
  <h1>Create HORIZON Admin</h1>
  <p>Create your admin account. Keep your setup key and password private.</p>

  <form id="setup">
    <label for="setupKey">Admin Setup Key</label>
    <input id="setupKey" type="password" minlength="32" required autocomplete="off">

    <label for="username">Admin Username</label>
    <input id="username" value="admin" minlength="2" maxlength="50" required autocomplete="username">

    <label for="password">Admin Password</label>
    <input id="password" type="password" minlength="4" maxlength="128" required autocomplete="new-password">

    <button type="submit">Create Admin Account</button>
  </form>

  <p id="message" role="status"></p>
</main>

<script>
document.getElementById("setup").addEventListener("submit", async (event) => {
  event.preventDefault();

  const button = event.currentTarget.querySelector("button");
  const message = document.getElementById("message");

  button.disabled = true;
  message.textContent = "Creating account…";

  try {
    const response = await fetch("/api/setup-admin", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        setupKey: document.getElementById("setupKey").value,
        username: document.getElementById("username").value,
        password: document.getElementById("password").value
      })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "Setup failed.");
    }

    event.currentTarget.reset();
    message.textContent = "Admin account created. Open /admin.html and sign in.";
  } catch (error) {
    message.textContent = error.message;
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
