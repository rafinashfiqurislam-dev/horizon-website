
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HORIZON — Create Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080d18;
      color: #eef3ff;
      font: 16px system-ui;
      padding: 20px;
    }

    main {
      width: min(100%, 420px);
      padding: 28px;
      border: 1px solid #26344c;
      border-radius: 18px;
      background: #101a2b;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    p {
      color: #aebbd0;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 18px 0 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #34445f;
      background: #091222;
      color: white;
      font: inherit;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #77a9ff;
      color: #07101e;
      font-weight: 700;
      font-size: 16px;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      margin-top: 16px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main>
    <h1>Create HORIZON Admin</h1>

    <p>
      Create your admin account.
      Keep your setup key and password private.
    </p>

    <form id="setup">

      <label for="setupKey">Admin Setup Key</label>
      <input
        id="setupKey"
        type="password"
        minlength="32"
        required
        autocomplete="off"
      >

      <label for="username">Admin Username</label>
      <input
        id="username"
        value="Rafin"
        minlength="2"
        maxlength="50"
        required
        autocomplete="username"
      >

      <label for="password">Admin Password</label>
      <input
        id="password"
        type="password"
        minlength="12"
        maxlength="128"
        required
        autocomplete="new-password"
      >

      <button id="submitButton" type="submit">
        Create Admin Account
      </button>

    </form>

    <p id="message" role="status"></p>
  </main>

  <script>
    const form = document.getElementById("setup");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const setupKey =
        document.getElementById("setupKey").value;

      const username =
        document.getElementById("username").value;

      const password =
        document.getElementById("password").value;

      button.disabled = true;
      message.textContent = "Creating account…";

      try {
        const response = await fetch("/api/setup-admin", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            setupKey,
            username,
            password
          })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
            result.error || "Admin setup failed."
          );
        }

        // Reset using the saved form reference.
        form.reset();

        message.textContent =
          "Admin account created successfully. Open /admin.html and sign in.";

      } catch (error) {
        message.textContent = error.message;

      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
