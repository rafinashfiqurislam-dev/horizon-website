<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HORIZON — Explore</title><link rel="stylesheet" href="/style.css"><style>.detail{min-height:100vh;padding:130px 10vw 80px}.detail-image{width:100%;max-height:58vh;object-fit:cover;border-radius:22px;margin:35px 0}.detail h1{font:800 clamp(48px,8vw,90px) Manrope;letter-spacing:-4px;margin:20px 0}.detail-copy{max-width:760px;color:#c2ccda;line-height:1.9;white-space:pre-line}.detail .pill{margin-top:30px}</style></head><body><header class="topbar"><a class="wordmark" href="/">HORIZON<span>.</span></a><a href="/" class="back">Back to HORIZON ↗</a></header><main class="detail"><p class="eyebrow" id="type">HORIZON / EXPLORE</p><h1 id="name">Loading…</h1><p class="detail-copy" id="short"></p><img id="image" class="detail-image" hidden alt=""><p id="description" class="detail-copy"></p><a id="external" class="pill" hidden target="_blank" rel="noopener">Explore website ↗</a></main><script>
(async()=>{const id=new URLSearchParams(location.search).get('id');if(!id)return location.href='/';const r=await fetch('/api/items/'+encodeURIComponent(id));if(!r.ok){document.querySelector('#name').textContent='Not found';return}const x=await r.json();document.title='HORIZON — '+x.name;document.querySelector('#type').textContent='HORIZON / '+x.type.toUpperCase();document.querySelector('#name').textContent=x.name;document.querySelector('#short').textContent=x.short_perception||'';document.querySelector('#description').textContent=x.description||'';if(x.image){const img=document.querySelector('#image');img.src=x.image;img.hidden=false;img.alt=x.name}if(x.status==='published'&&x.button_url){const a=document.querySelector('#external');a.href=x.button_url;a.textContent=(x.button_text||'Explore')+' ↗';a.hidden=false}})();</script></body></html>
